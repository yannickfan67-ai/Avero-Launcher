name: Android CI

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'scripts/**'
      - '*.md'
      - '**/*.md'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'scripts/**'
      - '*.md'
      - '**/*.md'
      - '.github/workflows/android.yml'

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Lint download-only app
        run: gradle lintDebug --stacktrace
      - name: Verify compiled download-only boundary
        run: python ../scripts/verify-download-only.py app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Avero-0.2.0-download-only-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
